<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>HyperFrames · failed</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "Chakra Petch", sans-serif; color: #fff; }
  /* Full-window atmosphere: outside the letterboxed stage, so lights always reach the window edges. */
  #bleed { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  #dim { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(40,0,4,.55) 0%, rgba(0,0,0,.9) 80%); }
  #flash { position: absolute; inset: 0; background: #ff2d3d; opacity: 0; mix-blend-mode: screen; }
  .siren { position: absolute; top: 0; bottom: 0; width: 50%; opacity: 0; mix-blend-mode: screen; }
  #s-red { left: 0; background: linear-gradient(90deg, rgba(255,45,61,.55), transparent); }
  #s-blue { right: 0; background: linear-gradient(270deg, rgba(45,107,255,.55), transparent); }
  .tape { position: absolute; left: -50%; width: 200%; height: 70px; background: repeating-linear-gradient(-45deg, #ff2d3d 0 40px, #111 40px 80px);
    box-shadow: 0 8px 30px rgba(0,0,0,.6); }
  #tape-1 { top: 250px; transform: rotate(-4deg); }
  #tape-2 { bottom: 300px; transform: rotate(3deg); }
  #headline { position: absolute; left: 0; right: 0; top: 380px; text-align: center; font-weight: 700; font-size: 220px; letter-spacing: .08em;
    color: #ff2d3d; text-shadow: 6px 0 #2d6bff, -6px 0 rgba(255,45,61,.6), 0 0 60px rgba(255,45,61,.6); }
  #subtitle { position: absolute; left: 0; right: 0; top: 640px; text-align: center; font: 600 40px "JetBrains Mono", monospace; letter-spacing: .4em; }
</style>
</head>
<body>
<div id="bleed">
  <div id="dim"></div>
  <div id="s-red" class="siren"></div>
  <div id="s-blue" class="siren"></div>
  <div id="flash"></div>
</div>
<div id="stage" data-composition-id="failed" data-start="0" data-width="1920" data-height="1080">
  <div id="tape-1" class="tape"></div>
  <div id="tape-2" class="tape"></div>
  <div id="headline">YOU FAILED</div>
  <div id="subtitle" data-bind="subtitle">SUBJECT RE-DETAINED</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.from("#dim", { opacity: 0, duration: 0.3 }, 0)
      .fromTo("#flash", { opacity: 0.9 }, { opacity: 0, duration: 0.5, ease: "power2.out" }, 0)
      .from("#tape-1", { xPercent: -110, duration: 0.45, ease: "power4.out" }, 0.1)
      .from("#tape-2", { xPercent: 110, duration: 0.45, ease: "power4.out" }, 0.2)
      .from("#headline", { scale: 2.6, opacity: 0, duration: 0.35, ease: "power4.in" }, 0.3)
      .to("#stage", { x: 14, duration: 0.05, repeat: 7, yoyo: true }, 0.65)
      .from("#subtitle", { opacity: 0, letterSpacing: "1.2em", duration: 0.8, ease: "power2.out" }, 0.8)
      .to("#s-red", { opacity: 1, duration: 0.4, repeat: -1, yoyo: true }, 0.6)
      .to("#s-blue", { opacity: 1, duration: 0.4, repeat: -1, yoyo: true, delay: 0.4 }, 0.6)
      .to("#headline", { skewX: "random(-12, 12)", x: "random(-10, 10)", duration: 0.06, repeat: 5, yoyo: true, repeatDelay: 1.8, repeatRefresh: true }, 1.6);

    window.__timelines = window.__timelines || {};
    window.__timelines.failed = tl;

    const fit = () => {
      const s = Math.min(innerWidth / 1920, innerHeight / 1080); // contain: keep all type on screen (mobile safe)
      const stage = document.getElementById("stage");
      stage.style.transform = `scale(${s})`;
      stage.style.left = `${(innerWidth - 1920 * s) / 2}px`;
      stage.style.top = `${(innerHeight - 1080 * s) / 2}px`;
    };
    addEventListener("resize", fit); fit();
    if (!new URLSearchParams(location.search).has("embed")) tl.play();
  </script>
</div>
</body>
</html>
