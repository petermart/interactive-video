<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>HyperFrames · escaped</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "Chakra Petch", sans-serif; color: #fff; }
  #glow { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 60%, rgba(255,138,42,.35) 0%, rgba(4,20,24,.85) 75%); }
  #stamp { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%) rotate(-8deg); padding: 10px 60px; border: 12px solid #1fb5b0;
    font-weight: 700; font-size: 230px; letter-spacing: .1em; color: #1fb5b0; text-shadow: 0 0 50px rgba(31,181,176,.6); }
  #line { position: absolute; left: 0; right: 0; top: 700px; text-align: center; font: 600 38px "JetBrains Mono", monospace; letter-spacing: .35em; color: #ff8a2a; }
  .ray { position: absolute; left: 50%; top: 60%; width: 8px; height: 1400px; margin-left: -4px; transform-origin: 50% 0; background: linear-gradient(rgba(255,138,42,.25), transparent); }
</style>
</head>
<body>
<div id="stage" data-composition-id="escaped" data-start="0" data-width="1920" data-height="1080">
  <div id="glow"></div>
  <div id="rays"></div>
  <div id="stamp">ESCAPED</div>
  <div id="line" data-bind="line">SUBJECT 4471 IS OFF THE GRID</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    const rays = document.getElementById("rays");
    for (let i = 0; i < 18; i++) {
      const r = document.createElement("div");
      r.className = "ray";
      r.style.transform = `rotate(${i * 20}deg)`;
      rays.appendChild(r);
    }

    const tl = gsap.timeline({ paused: true });
    tl.from("#glow", { opacity: 0, duration: 0.8 }, 0)
      .from(".ray", { scaleY: 0, duration: 1.2, stagger: 0.03, ease: "expo.out" }, 0.1)
      .from("#stamp", { scale: 3, opacity: 0, duration: 0.4, ease: "power4.in" }, 0.4)
      .to("#stage", { y: 10, duration: 0.05, repeat: 5, yoyo: true }, 0.8)
      .from("#line", { opacity: 0, y: 30, duration: 0.6 }, 1.1)
      .to("#rays", { rotation: 360, transformOrigin: "960px 648px", duration: 60, repeat: -1, ease: "none" }, 1.3);

    window.__timelines = window.__timelines || {};
    window.__timelines.escaped = tl;

    const fit = () => {
      const s = Math.max(innerWidth / 1920, innerHeight / 1080);
      const stage = document.getElementById("stage");
      stage.style.transform = `scale(${s})`;
      stage.style.left = `${(innerWidth - 1920 * s) / 2}px`;
      stage.style.top = `${(innerHeight - 1080 * s) / 2}px`;
    };
    addEventListener("resize", fit); fit();
    if (!new URLSearchParams(location.search).has("embed")) tl.play();
  </script>
</div>
</body>
</html>
