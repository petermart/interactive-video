<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>HyperFrames · prompt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "Chakra Petch", sans-serif; color: #fff; }
  .corner { position: absolute; width: 60px; height: 60px; border: 3px solid rgba(31,181,176,.85); }
  #c-tl { left: 560px; top: 250px; border-right: 0; border-bottom: 0; }
  #c-tr { right: 560px; top: 250px; border-left: 0; border-bottom: 0; }
  #c-bl { left: 560px; bottom: 330px; border-right: 0; border-top: 0; }
  #c-br { right: 560px; bottom: 330px; border-left: 0; border-top: 0; }
  #lock { position: absolute; left: 560px; top: 206px; font: 600 22px "JetBrains Mono", monospace; letter-spacing: .25em; color: #1fb5b0; }
  #rec { position: absolute; right: 560px; top: 206px; font: 600 22px "JetBrains Mono", monospace; letter-spacing: .25em; color: #ff2d3d; }
  #rec::before { content: ""; display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #ff2d3d; margin-right: 10px; }
  #panel { position: absolute; left: 0; right: 0; bottom: 170px; text-align: center; }
  #question { display: inline-block; padding: 14px 34px; background: rgba(0,0,0,.55); border-left: 6px solid #ff8a2a;
    font-weight: 700; font-size: 58px; letter-spacing: .06em; text-shadow: 0 0 24px rgba(0,0,0,.8); }
  #cursor { display: inline-block; width: 28px; height: 54px; margin-left: 8px; vertical-align: -6px; background: #ff8a2a; }
</style>
</head>
<body>
<div id="stage" data-composition-id="prompt" data-start="0" data-width="1920" data-height="1080">
  <div id="c-tl" class="corner"></div><div id="c-tr" class="corner"></div>
  <div id="c-bl" class="corner"></div><div id="c-br" class="corner"></div>
  <div id="lock">TARGET LOCK · SLOPPY JOE · 4471</div>
  <div id="rec">LIVE</div>
  <div id="panel"><span id="question"><span data-bind="question">WHAT SHOULD SLOPPY JOE DO NEXT?</span><span id="cursor"></span></span></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.from(".corner", { scale: 2.2, opacity: 0, duration: 0.45, stagger: 0.05, ease: "power3.out" }, 0)
      .from(["#lock", "#rec"], { opacity: 0, y: -12, duration: 0.35, stagger: 0.1 }, 0.25)
      .from("#question", { clipPath: "inset(0 100% 0 0)", duration: 0.7, ease: "power2.out" }, 0.35)
      // Ambient loop: breathing brackets, blinking cursor and REC dot.
      .to(".corner", { scale: 1.04, duration: 1.4, repeat: -1, yoyo: true, ease: "sine.inOut" }, 0.8)
      .to("#cursor", { opacity: 0, duration: 0.01, repeat: -1, yoyo: true, repeatDelay: 0.5 }, 1)
      .to("#rec", { opacity: 0.35, duration: 0.6, repeat: -1, yoyo: true }, 1);

    window.__timelines = window.__timelines || {};
    window.__timelines.prompt = tl;

    const fit = () => {
      const s = Math.min(innerWidth / 1920, innerHeight / 1080); // contain: keep all type on screen
      const stage = document.getElementById("stage");
      stage.style.transform = `scale(${s})`;
      stage.style.left = `${(innerWidth - 1920 * s) / 2}px`;
      stage.style.top = `${(innerHeight - 1080 * s) / 2}px`;
    };
    addEventListener("resize", fit); fit();
    if (!new URLSearchParams(location.search).has("embed")) tl.play();
  </script>
</div>
</body>
</html>
